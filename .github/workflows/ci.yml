name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the older run obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/investment-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: services/investment-service/pom.xml

      # `verify` runs the unit tests and the Testcontainers integration tests (Docker is preinstalled on the runner)
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            services/investment-service/target/surefire-reports
            services/investment-service/target/failsafe-reports

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Builds both images and starts the whole stack; --wait fails if a service does not become healthy
      - name: Build and start the stack
        run: docker compose up -d --build --wait

      # Goes through nginx, so this covers the frontend image, the /api proxy, the backend and the database.
      # "Gold" must be a name in the investment_catalog seed data (db/changelog); investment creation
      # looks the name up there and rejects anything else with 400.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error localhost:3000/ > /dev/null
          curl --fail --silent --show-error -X POST localhost:3000/api/investments \
            -H 'Content-Type: application/json' -d '{"name":"Gold","amount":1.5}'
          echo
          curl --fail --silent --show-error localhost:3000/api/investments | grep Gold

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
