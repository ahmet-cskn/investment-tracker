services:
  postgres:
    image: postgres:17-alpine
    container_name: investment-tracker-postgres
    environment:
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
