services:
  postgres:
    image: postgres:17-alpine
    container_name: investment-tracker-postgres
    environment:
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  investment-service:
    build: ./services/investment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/investment_tracker
      DB_USERNAME: investment
      DB_PASSWORD: investment
      # From the git-ignored .env file (see .env.example); optional: without it prices are just unavailable
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The port only opens once Spring has started, i.e. after the Liquibase migrations have run
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      investment-service:
        condition: service_healthy
    healthcheck:
      # Without this, `docker compose up --wait` returns while nginx may not yet accept connections.
      # 127.0.0.1 rather than localhost: nginx listens on IPv4 only and localhost may resolve to ::1.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scrapes investment-service's /actuator/prometheus every 15s; see monitoring/prometheus/prometheus.yml
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      investment-service:
        condition: service_healthy

  # Dashboards at http://localhost:3001 (admin/admin); datasource and dashboard are provisioned from
  # monitoring/grafana, so nothing needs configuring by hand
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
